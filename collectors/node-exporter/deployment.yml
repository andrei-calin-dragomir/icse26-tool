# collectors/node-exporter.yml
services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    ports:
      - "19100:9100"
    networks:
      - default
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(diskstats|sys|proc|host|etc)($$|/)"
      # - '--collector.rapl' If Scaphandre is doing it, this is redundant
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          propagation: rshared

      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
        bind:
          propagation: rshared

      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rshared