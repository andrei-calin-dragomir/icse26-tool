# You can copy this scrape config into your main Prometheus configuration file to enable scraping of Scaphandre metrics.
global:
  scrape_interval: 2s # If set lower than 2s, scaphandre power metrics will fail to scrape
  scrape_timeout: 2s

scrape_configs:
  - job_name: 'scaphandre'
    static_configs:
      - targets: ['scaphandre:8080']