# storage/postgres.yml
services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    expose:
      - "15432"
    networks:
      - default
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:

networks:
  ${DOCKER_NETWORK}:
